name: Build Windows (绿色版 + 便携版)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

# 发布 Release 需要写权限
permissions:
  contents: write

jobs:
  build-windows:
    name: Windows 绿色版 / 便携版
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: 版本信息
        run: flutter --version

      - name: 拉取依赖
        run: flutter pub get

      - name: 单元测试（干支排盘）
        run: flutter test test/algorithms/ganzhi_paipan_test.dart

      - name: 编译 Windows Release
        run: flutter build windows --release

      - name: 组装 + 打两个包
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # 1) 找产物目录
          $candidates = @("build/windows/x64/runner/Release", "build/windows/runner/Release")
          $out = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $out) { throw "找不到编译产物目录" }
          Write-Host "产物目录: $out"
          Get-ChildItem $out | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table

          # 2) 组装绿色版目录
          $folder = "六爻助手-Windows绿色版"
          $stage  = Join-Path "stage" $folder
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$out/*" $stage -Recurse -Force

          $exeOld = Join-Path $stage "liuyao_app.exe"
          if (-not (Test-Path $exeOld)) { throw "产物里没有 liuyao_app.exe" }
          Rename-Item $exeOld "六爻助手.exe"

          # 3) 使用说明
          $sha = "${{ github.sha }}".Substring(0,7)
          $readme = @'
          六爻助手  Windows 版
          ====================

          【绿色版】解压后整个文件夹随便放，双击「六爻助手.exe」即可，不用安装。
          【便携版】单个 exe，双击会自动解压到本机缓存目录并启动，不写注册表。

          起卦方式
          --------
          手动排盘   输入六次摇卦的背面数
          干支排盘   直接指定 年 / 月建 / 日辰 / 时辰，六爻默认全阳，
                     点爻画切阴阳、勾「动」即为动爻。用于录入古籍卦例、
                     复盘他人卦例（不依赖公历时间）
          在线起卦   仅手机版

          桌面版说明
          ----------
          * 摇一摇、拍照 OCR、内置论坛浏览器依赖手机传感器/相机/WebView，
            桌面端点击会提示「桌面版暂不支持」。
          * 排盘记录保存在 %USERPROFILE%\Documents\liuyao_records.db
            备份或换机时复制这个文件即可。

          若提示「未知发布者」，点「更多信息 → 仍要运行」。
          不要单独移动 exe，data 文件夹要和它放在一起。
          '@
          $readme = $readme -replace '^ {10}', ''
          Set-Content -Path (Join-Path $stage "使用说明.txt") -Value $readme -Encoding UTF8

          # 4) 绿色版 zip（-mcu=on 强制 UTF-8 文件名，免得中文名乱码）
          #    在 stage 目录内打，这样压缩包里第一层就是「六爻助手-Windows绿色版」
          $greenZip = "六爻助手-Windows绿色版.zip"
          Push-Location stage
          if (Test-Path "..\$greenZip") { Remove-Item "..\$greenZip" -Force }
          7z a -tzip -mx=7 -mcu=on "..\$greenZip" $folder | Out-Null
          Pop-Location
          if (-not (Test-Path $greenZip)) { throw "绿色版打包失败" }
          Write-Host ("绿色版: {0:N1} MB" -f ((Get-Item $greenZip).Length / 1MB))

          # 5) 便携版：内容打成 payload.zip（必须在 stage 内部打，否则会带上 stage\ 前缀）
          $payload = "payload.zip"
          $payloadFull = Join-Path (Get-Location) $payload
          if (Test-Path $payload) { Remove-Item $payload -Force }
          Push-Location $stage
          7z a -tzip -mx=7 -mcu=on $payloadFull "*" | Out-Null
          Pop-Location
          Write-Host ("payload: {0:N1} MB" -f ((Get-Item $payload).Length / 1MB))

          # 自查：payload 第一层必须是文件/目录本身，不能是 stage/
          $names = & 7z l -ba -slt $payload 2>$null | Select-String '^Path = ' | ForEach-Object { ($_ -replace '^Path = ','') }
          $tops = $names | ForEach-Object { ($_ -split '\\')[0] } | Sort-Object -Unique
          Write-Host ("payload 第一层: " + ($tops -join ', '))
          if ($tops -contains 'stage') { throw "payload.zip 里带了 stage/ 前缀" }

          # 6) 生成启动器源码（C# 5 语法，兼容 .NET Framework 的 csc）
          $cs = @'
          using System;
          using System.Diagnostics;
          using System.IO;
          using System.IO.Compression;
          using System.Reflection;
          using System.Windows.Forms;

          static class Program
          {
              const string BuildTag = "__TAG__";

              [STAThread]
              static void Main()
              {
                  try
                  {
                      string dir = Path.Combine(
                          Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData),
                          "LiuYaoAssistant");
                      string exe = Path.Combine(dir, "六爻助手.exe");
                      string tagFile = Path.Combine(dir, ".build");

                      bool needExtract = !File.Exists(exe) || !File.Exists(tagFile)
                                         || File.ReadAllText(tagFile).Trim() != BuildTag;

                      if (needExtract)
                      {
                          if (Directory.Exists(dir)) Directory.Delete(dir, true);
                          Directory.CreateDirectory(dir);

                          string tmp = Path.Combine(Path.GetTempPath(),
                              "liuyao_" + Guid.NewGuid().ToString("N") + ".zip");
                          Stream src = Assembly.GetExecutingAssembly().GetManifestResourceStream("payload.zip");
                          using (FileStream fs = File.Create(tmp)) { src.CopyTo(fs); }
                          src.Close();

                          ZipFile.ExtractToDirectory(tmp, dir);
                          File.Delete(tmp);
                          File.WriteAllText(tagFile, BuildTag);
                      }

                      // 兜底：万一解压多了一层目录，就在子目录里找
                      if (!File.Exists(exe))
                      {
                          string[] found = Directory.GetFiles(dir, "六爻助手.exe",
                              SearchOption.AllDirectories);
                          if (found.Length > 0)
                          {
                              exe = found[0];
                              dir = Path.GetDirectoryName(exe);
                          }
                          else
                          {
                              throw new FileNotFoundException("解压后找不到 六爻助手.exe");
                          }
                      }

                      Process.Start(new ProcessStartInfo(exe) { WorkingDirectory = dir });
                  }
                  catch (Exception e)
                  {
                      MessageBox.Show("启动失败：" + e.Message + "\r\n\r\n可改用绿色版（解压文件夹后运行）。",
                          "六爻助手", MessageBoxButtons.OK, MessageBoxIcon.Error);
                  }
              }
          }
          '@
          $cs = $cs -replace '^ {10}', ''
          $cs = $cs.Replace('__TAG__', $sha)
          Set-Content -Path launcher.cs -Value $cs -Encoding UTF8

          # 7) 编译单文件便携版
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) {
            $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework\v4.0.30319\csc.exe"
          }
          if (-not (Test-Path $csc)) { throw "找不到 csc.exe" }
          $portable = "六爻助手-便携版.exe"
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ `
                 /out:$portable `
                 /resource:payload.zip,payload.zip `
                 /reference:System.dll `
                 /reference:System.Core.dll `
                 /reference:System.IO.Compression.dll `
                 /reference:System.IO.Compression.FileSystem.dll `
                 /reference:System.Windows.Forms.dll `
                 launcher.cs
          if ($LASTEXITCODE -ne 0) { throw "便携版编译失败" }
          if (-not (Test-Path $portable)) { throw "便携版没生成" }
          Write-Host ("便携版: {0:N1} MB" -f ((Get-Item $portable).Length / 1MB))

          # 8) 汇总
          Get-ChildItem $greenZip, $portable | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table

      - name: 上传绿色版
        uses: actions/upload-artifact@v4
        with:
          name: win-portable-folder
          path: 六爻助手-Windows绿色版.zip
          retention-days: 30

      - name: 上传便携版
        uses: actions/upload-artifact@v4
        with:
          name: win-single-exe
          path: 六爻助手-便携版.exe
          retention-days: 30

      # artifact 走 Azure blob，国内下载只有 20KB/s；
      # Release 资源走 objects.githubusercontent.com，快十几倍，所以再发一份
      - name: 发布到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh 传中文资产名会被吞掉（六爻助手-便携版.exe 变成 -.exe），
          # 所以 Release 上用 ASCII 名，中文名保留在工件和压缩包内层目录
          Copy-Item "六爻助手-Windows绿色版.zip" "liuyao-assistant-windows-folder.zip" -Force
          Copy-Item "六爻助手-便携版.exe" "liuyao-assistant-portable.exe" -Force

          $tag = "build-${{ github.run_number }}"
          $title = "六爻助手 Windows 构建 ${{ github.run_number }}"
          $notes = @'
          ### 下载哪个？

          | 文件 | 内容 |
          |---|---|
          | `liuyao-assistant-windows-folder.zip` | **绿色版**：解压后是一整个 `六爻助手-Windows绿色版` 文件夹，双击里面的 `六爻助手.exe` 即用 |
          | `liuyao-assistant-portable.exe` | **便携版**：单个 exe，双击自动解压到本机缓存后启动 |

          本次包含「干支排盘」：直接指定 年 / 月建 / 日辰 / 时辰，六爻默认全阳，
          点爻画切阴阳、勾「动」为动爻，不依赖公历时间（用于录入古籍卦例、复盘他人卦例）。

          桌面端不支持摇一摇、拍照 OCR、内置论坛浏览器（依赖手机传感器/相机/WebView），点击会提示。
          '@
          $notes = $notes -replace '^ {10}', ''
          gh release create $tag `
            liuyao-assistant-windows-folder.zip `
            liuyao-assistant-portable.exe `
            --title $title `
            --notes $notes `
            --latest
